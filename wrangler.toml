# Cloudflare Workers Static Assets config for the Astro SSG output.
# Workers Builds runs `npm run build`, then `npx wrangler deploy`.

name = "cochinchine-pensee"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"

# Cloudflare Web Analytics is configured separately from the site’s GA4 tag.
# Enable in Cloudflare dashboard: Workers & Pages → cochinchine-pensee → Analytics
